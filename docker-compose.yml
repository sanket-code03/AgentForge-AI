services:
  mysql:
    image: mysql:8.4
    container_name: agentforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agentforge
      MYSQL_USER: agentforge
      MYSQL_PASSWORD: agentforge_local_password
      MYSQL_ROOT_PASSWORD: local_root_change_me
    ports: ["3306:3306"]
    volumes: [agentforge_mysql_data:/var/lib/mysql]
volumes:
  agentforge_mysql_data:
