server:
  port: 8080
spring:
  application:
    name: agentforge-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agentforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:agentforge}
    password: ${DB_PASSWORD:agentforge_local_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-to-a-strong-secret-key-123456}
    expiration-minutes: 720
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder:3b}
